inventory:
  warehouse-code: "WH-BLR-01"
  max-order-quantity: 500
  express-shipping-enabled: false
  low-stock-threshold: 25
  # Stored ENCRYPTED in the bucket. SSE-KMS protects the object at rest; {cipher} protects
  # the value from anyone with read access to the bucket. Defence in depth.
  downstream-api-key: '{cipher}'
