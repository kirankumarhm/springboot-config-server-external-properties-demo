name: config-s3-demo

# Floci (the local AWS emulator) runs OUTSIDE this stack, started with `floci start`, so there is
# no S3/SQS container here. Reaching it from inside a container needs two things:
#
#   1. extra_hosts mapping localhost.floci.io to host-gateway, because a container's own
#      "localhost" is not the host.
#   2. the BUCKET-prefixed hostname mapped too. The AWS SDK uses virtual-host-style addressing
#      (bucket.host) with a custom endpoint, and Floci's wildcard DNS resolves
#      <bucket>.localhost.floci.io on the host but not inside a container.
#
# Mapping the known bucket name explicitly avoids having to force path-style addressing, which
# AwsS3EnvironmentProperties does not expose as a property anyway.

x-floci-hosts: &floci-hosts
  - "localhost.floci.io:host-gateway"
  - "acme-platform-config.localhost.floci.io:host-gateway"

services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: cfg-s3-rabbitmq
    ports:
      - "5674:5672"
      - "15674:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  config-server:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../config-server
      dockerfile: Dockerfile
    container_name: cfg-s3-server
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8908:8888"
      - "9900:9888"
    extra_hosts: *floci-hosts
    volumes:
      # The private key is a mounted secret, read-only, never baked into the image.
      - ../secrets:/secrets:ro
    environment:
      MANAGEMENT_PORT: 9888
      ENCRYPT_KEYSTORE_LOCATION: file:/secrets/config-server.p12
      ENCRYPT_KEYSTORE_PASSWORD: keystore-secret
      ENCRYPT_KEYSTORE_ALIAS: configkey
      AWS_ENDPOINT: http://localhost.floci.io:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CONFIG_BUCKET: acme-platform-config
      CONFIG_CHANGE_QUEUE: config-change-queue
      CONFIG_KEY_PREFIX: main/
      RABBITMQ_HOST: rabbitmq
      CONFIG_ADMIN_PASSWORD: "{noop}admin-secret"
      CONFIG_CLIENT_PASSWORD: "{noop}client-secret"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 25s

  inventory-service:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: cfg-s3-inventory
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8101:8101"
      - "9101:9101"
    environment:
      SERVER_PORT: 8101
      MANAGEMENT_PORT: 9101
      CONFIG_SERVER_URI: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  pricing-service:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../pricing-service
      dockerfile: Dockerfile
    container_name: cfg-s3-pricing
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8102:8102"
      - "9102:9102"
    environment:
      SERVER_PORT: 8102
      MANAGEMENT_PORT: 9102
      CONFIG_SERVER_URI: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9102/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Node.js: reads the Config Server with the cloud-config-client library and joins Spring Cloud
  # Bus through RabbitMQ, so the same broadcast that refreshes the Spring services refreshes it.
  node-service:
    build:
      context: ../node-service
      args:
        # Empty unless you are behind a TLS-inspecting proxy; see ../node-service/Dockerfile.
        EXTRA_CA_CERT: ${EXTRA_CA_CERT:-}
    container_name: cfg-s3-node
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8104:8104"
    environment:
      PORT: 8104
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8104/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Go: reads the Config Server with the cloudconfigclient library and joins Spring Cloud Bus
  # through RabbitMQ, exactly like node-service.
  go-service:
    build:
      context: ../go-service
      args:
        # Empty unless you are behind a TLS-inspecting proxy; see ../go-service/Dockerfile.
        EXTRA_CA_CERT: ${EXTRA_CA_CERT:-}
    container_name: cfg-s3-go
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8105:8105"
    environment:
      PORT: 8105
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8105/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # lambda-service is NOT in this file: it runs in Floci's Lambda emulator.
  # See ../lambda-service/scripts/deploy-floci.sh.
