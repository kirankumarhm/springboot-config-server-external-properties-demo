server:
  # Graceful shutdown: without this a rolling update severs in-flight requests. Pair with
  # terminationGracePeriodSeconds and a preStop hook so endpoints deregister before SIGTERM.
  shutdown: graceful
  port: ${SERVER_PORT:8101}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: inventory-service

  # No 'optional:' prefix, so an unreachable Config Server is a hard startup failure rather than
  # a service that starts with no configuration. Retry parameters ride on the URI.
  config:
    import: "configserver:${CONFIG_SERVER_URI:http://localhost:8908}?fail-fast=true&max-attempts=6&initial-interval=1000&multiplier=1.5&max-interval=8000"
  cloud:
    bus:
      # Makes the Spring Cloud Bus service id (app:index:id) unique per instance. Without this,
      # two instances of the same app can collide and duplicate-event suppression silently drops
      # a refresh on one of them.
      id: ${spring.application.name}:${APP_INDEX:${SERVER_PORT:8101}}:${random.uuid}
    config:
      username: ${CONFIG_CLIENT_USERNAME:config-client}
      password: ${CONFIG_CLIENT_PASSWORD:client-secret}
      label: ${CONFIG_LABEL:main}
      request-connect-timeout: 5000
      request-read-timeout: 15000
    stream:
      rabbit:
        binder:
          connection-name-prefix: ${spring.application.name}:${APP_INDEX:${SERVER_PORT:8101}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5674}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  server:
    port: ${MANAGEMENT_PORT:9101}
  endpoints:
    web:
      exposure:
        # Health only. Refreshes arrive over RabbitMQ (Spring Cloud Bus), so the clients do not
        # need an HTTP refresh endpoint - and an open one would let anyone trigger reloads.
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true


logging:
  level:
    com.example.config: INFO
    org.springframework.cloud.bus: INFO
