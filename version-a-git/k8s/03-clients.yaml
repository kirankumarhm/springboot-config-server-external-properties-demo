apiVersion: v1
kind: Service
metadata:
  name: node-service
  namespace: config-demo
spec:
  selector:
    app: node-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
# Node.js client. Reads the Config Server over HTTP and joins Spring Cloud Bus through RabbitMQ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
  namespace: config-demo
  labels:
    app: node-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: node-service
  template:
    metadata:
      labels:
        app: node-service
    spec:
      automountServiceAccountToken: false
      # Same reason as the Spring clients: a Service named "rabbitmq" would otherwise inject
      # RABBITMQ_PORT=tcp://10.x.x.x:5672, which is not a port number.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-service
          image: config-git-demo-node-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef: { name: client-env }
          env:
            - name: PORT
              value: "8084"
            - name: CONFIG_CLIENT_PASSWORD
              valueFrom: { secretKeyRef: { name: config-credentials, key: CONFIG_CLIENT_PASSWORD } }
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: config-credentials, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: config-credentials, key: RABBITMQ_PASSWORD } }
          # The service exits if the Config Server is unreachable at startup; give a cold start
          # room to retry while the server is still coming up.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
