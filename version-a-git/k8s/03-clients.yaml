# The four in-cluster client services: inventory-service and pricing-service (Spring Boot),
# node-service (Node.js) and go-service (Go). All four join Spring Cloud Bus through RabbitMQ, so
# one broadcast from the Config Server refreshes every one of them. (lambda-service runs in Floci's
# Lambda emulator, not in the cluster.)
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: config-demo
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: management
      port: 9081
      targetPort: 9081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: config-demo
  labels:
    app: inventory-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      automountServiceAccountToken: false
      # Kubernetes injects legacy Docker-link environment variables for every Service in the
      # namespace, so a Service named "rabbitmq" produces RABBITMQ_PORT=tcp://10.x.x.x:5672.
      # That shadows ${RABBITMQ_PORT:5672} in application.yml and the app dies at startup with
      # NumberFormatException: For input string: "tcp://10.97.198.48:5672".
      # Disabling service links removes the whole class of collision; RABBITMQ_PORT is also set
      # explicitly in the ConfigMap so the intent is visible rather than implicit.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          image: config-git-demo-inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
            - name: management
              containerPort: 9081
          envFrom:
            - configMapRef: { name: client-env }
          env:
            # Explicit, so the probes below always match the ports the app listens on.
            - name: SERVER_PORT
              value: "8081"
            - name: MANAGEMENT_PORT
              value: "9081"
            - name: CONFIG_CLIENT_PASSWORD
              valueFrom: { secretKeyRef: { name: config-credentials, key: CONFIG_CLIENT_PASSWORD } }
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: config-credentials, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: config-credentials, key: RABBITMQ_PASSWORD } }
            - name: APP_INDEX
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          # Generous failureThreshold: the client fails fast if the Config Server is unreachable,
          # which is correct behaviour but means a cold start where the server is still coming up
          # needs room to retry rather than being declared dead.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
