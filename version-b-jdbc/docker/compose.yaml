name: config-jdbc-demo

services:

  postgres:
    # Reuses the postgres:17.6 image already present locally. 17.x also clears the PostgreSQL 15
    # floor required by the UNIQUE NULLS NOT DISTINCT constraint in V1__config_schema.sql.
    image: postgres:17.6
    container_name: cfg-jdbc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: configdb
      POSTGRES_USER: config_admin
      POSTGRES_PASSWORD: config-secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config_admin -d configdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: cfg-jdbc-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  config-server:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../config-server
      dockerfile: Dockerfile
    container_name: cfg-jdbc-server
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8898:8888"
      - "9899:9888"
    volumes:
      # The private key is a mounted secret, read-only, never baked into the image.
      - ../secrets:/secrets:ro
    environment:
      MANAGEMENT_PORT: 9888
      ENCRYPT_KEYSTORE_LOCATION: file:/secrets/config-server.p12
      ENCRYPT_KEYSTORE_PASSWORD: keystore-secret
      ENCRYPT_KEYSTORE_ALIAS: configkey
      DB_URL: jdbc:postgresql://postgres:5432/configdb
      DB_USERNAME: config_admin
      DB_PASSWORD: config-secret
      CONFIG_LABEL: main
      RABBITMQ_HOST: rabbitmq
      CONFIG_ADMIN_PASSWORD: "{noop}admin-secret"
      CONFIG_CLIENT_PASSWORD: "{noop}client-secret"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 25s

  inventory-service:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: cfg-jdbc-inventory
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8091:8081"
      - "9091:9081"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  pricing-service:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../pricing-service
      dockerfile: Dockerfile
    container_name: cfg-jdbc-pricing
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8092:8082"
      - "9092:9082"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  pricing-service-2:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../pricing-service
      dockerfile: Dockerfile
    container_name: cfg-jdbc-pricing-2
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8093:8083"
      - "9093:9083"
    environment:
      SERVER_PORT: 8083
      MANAGEMENT_PORT: 9083
      APP_INDEX: 8083
      CONFIG_SERVER_URI: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
