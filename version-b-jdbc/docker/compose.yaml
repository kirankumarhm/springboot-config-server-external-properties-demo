name: config-jdbc-demo

services:

  postgres:
    # Reuses the postgres:17.6 image already present locally. 17.x also clears the PostgreSQL 15
    # floor required by the UNIQUE NULLS NOT DISTINCT constraint in V1__config_schema.sql.
    image: postgres:17.6
    container_name: cfg-jdbc-postgres
    ports:
      # Host port 5433, not 5432: a PostgreSQL installed directly on the machine (very common on
      # developer laptops) already owns 5432, and Docker then refuses to start this container
      # with "bind: address already in use". Inside Docker, the Config Server still uses
      # postgres:5432. Override with POSTGRES_HOST_PORT if 5433 is taken too.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: configdb
      POSTGRES_USER: config_admin
      POSTGRES_PASSWORD: config-secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config_admin -d configdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: cfg-jdbc-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  config-server:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../config-server
      dockerfile: Dockerfile
    container_name: cfg-jdbc-server
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8898:8888"
      - "9899:9888"
    volumes:
      # The private key is a mounted secret, read-only, never baked into the image.
      - ../secrets:/secrets:ro
    environment:
      MANAGEMENT_PORT: 9888
      ENCRYPT_KEYSTORE_LOCATION: file:/secrets/config-server.p12
      ENCRYPT_KEYSTORE_PASSWORD: keystore-secret
      ENCRYPT_KEYSTORE_ALIAS: configkey
      DB_URL: jdbc:postgresql://postgres:5432/configdb
      DB_USERNAME: config_admin
      DB_PASSWORD: config-secret
      CONFIG_LABEL: main
      RABBITMQ_HOST: rabbitmq
      CONFIG_ADMIN_PASSWORD: "{noop}admin-secret"
      CONFIG_CLIENT_PASSWORD: "{noop}client-secret"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 25s

  inventory-service:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: cfg-jdbc-inventory
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8091:8091"
      - "9091:9091"
    environment:
      SERVER_PORT: 8091
      MANAGEMENT_PORT: 9091
      CONFIG_SERVER_URI: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  pricing-service:
    build:
      # Each service owns its Dockerfile and is built from its own directory - no shared
      # build context, and no MODULE argument selecting between siblings.
      context: ../pricing-service
      dockerfile: Dockerfile
    container_name: cfg-jdbc-pricing
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8092:8092"
      - "9092:9092"
    environment:
      SERVER_PORT: 8092
      MANAGEMENT_PORT: 9092
      CONFIG_SERVER_URI: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9092/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Node.js: reads the Config Server with the cloud-config-client library and joins Spring Cloud
  # Bus through RabbitMQ, so the same broadcast that refreshes the Spring services refreshes it.
  node-service:
    build:
      context: ../node-service
      args:
        # Empty unless you are behind a TLS-inspecting proxy; see ../node-service/Dockerfile.
        EXTRA_CA_CERT: ${EXTRA_CA_CERT:-}
    container_name: cfg-jdbc-node
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8094:8094"
    environment:
      PORT: 8094
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Go: reads the Config Server with the cloudconfigclient library and joins Spring Cloud Bus
  # through RabbitMQ, exactly like node-service.
  go-service:
    build:
      context: ../go-service
      args:
        # Empty unless you are behind a TLS-inspecting proxy; see ../go-service/Dockerfile.
        EXTRA_CA_CERT: ${EXTRA_CA_CERT:-}
    container_name: cfg-jdbc-go
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8095:8095"
    environment:
      PORT: 8095
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_CLIENT_PASSWORD: client-secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # lambda-service is NOT in this file: it runs in Floci's Lambda emulator.
  # See ../lambda-service/scripts/deploy-floci.sh.
